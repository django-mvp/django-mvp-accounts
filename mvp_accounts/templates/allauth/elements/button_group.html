{% load allauth %}
{% if attrs.vertical %}
  {% comment %} `collapse` is pinned off so the group cannot pick up the shell's sidebar variable of the same name. {% endcomment %}
  <c-mvp.group class="my-4" :collapse="False" :row="False">
    {% slot %}
    {% endslot %}
  </c-mvp.group>
{% else %}
  <c-mvp.group row wrap class="items-center my-4">
    {% slot %}
    {% endslot %}
  </c-mvp.group>
{% endif %}
