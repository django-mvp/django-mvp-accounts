{% load allauth %}
<form {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}
      class="flex flex-col gap-1 {% if 'entrance' not in attrs.tags|default:'' %}my-4{% endif %}">
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <div class="flex flex-wrap items-center gap-2 mt-3">
      {% slot actions %}
      {% endslot %}
    </div>
  {% endif %}
</form>
