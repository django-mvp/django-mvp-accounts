{% comment %}
  allauth's QR code is dark on transparent and cannot be scanned on a dark
  theme, so it sits on fixed `bg-white` with quiet-zone padding. `alt` is left
  out when allauth gives none: an empty `alt` marks the image decorative.
{% endcomment %}
<img src="{{ attrs.src }}"
     {% if attrs.alt %}alt="{{ attrs.alt }}"{% endif %}
     class="bg-white p-4 rounded">
