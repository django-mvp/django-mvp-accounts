{% load allauth %}
{% comment %}
  Named by provider id (`github`, `google`), not display name. The host
  project supplies the icon: see
  docs/adr/0003-provider-icons-come-from-the-host-project.md.
{% endcomment %}
<c-button href="{{ attrs.href }}"
          outline
          block
          icon="{{ attrs.provider_id }}"
          title="{{ attrs.name }}"
          text="{{ attrs.name }}" />
