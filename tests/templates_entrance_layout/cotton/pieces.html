{# @description A layout that draws each piece of an entrance page in an element of its own, so a test can tell which piece a control arrived in. #}
<div data-piece="logo">{{ logo }}</div>
<div data-piece="title">{{ title }}</div>
<div data-piece="providers">{{ providers }}</div>
<div data-piece="content">{{ slot }}</div>
<div data-piece="footer">{{ footer }}</div>
